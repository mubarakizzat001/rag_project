services:
  mongodb:
    image: mongo:8.2.5

    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodata:/data/db

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - rag_network

    restart: always

networks:
  rag_network:


volumes:
  mongodata:


